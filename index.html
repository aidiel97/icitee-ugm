  }

  btnFind.addEventListener('click', () => {
    searchSection.classList.add('active');
    btnFind.hidden = true;
    searchInput.focus();
  });

  searchClose.addEventListener('click', () => {
    searchSection.classList.remove('active');
    btnFind.hidden = false;
    searchInput.value = '';
    searchResults.innerHTML = '';
  });

  searchInput.addEventListener('input', () => {
    const q = searchInput.value.toLowerCase().trim();
    if (!q) { searchResults.innerHTML = ''; return; }

    const matched = papers.filter(p =>
      p.pid.toLowerCase().includes(q) ||
      p.title.toLowerCase().includes(q) ||
      p.pres.toLowerCase().includes(q) ||
      p.auth.toLowerCase().includes(q)
    );

    if (matched.length === 0) {
      searchResults.innerHTML = '<div class="no-results">No papers found.</div>';
      return;
    }

    searchResults.innerHTML = matched.map(p => `
      <div class="paper-card">
        <p class="paper-id">${escapeHTML(p.conf)} &middot; ${escapeHTML(p.pid)}</p>
        <p class="paper-title">${escapeHTML(p.title)}</p>
        <p class="paper-meta"><strong>Presenter:</strong> ${escapeHTML(p.pres)}</p>
        <p class="paper-meta"><strong>Authors:</strong> ${escapeHTML(p.auth)}</p>
        <p class="paper-meta"><strong>Session:</strong> ${escapeHTML(p.topic)}</p>
        <p class="paper-meta"><strong>Schedule:</strong> ${escapeHTML(p.day)}, ${escapeHTML(p.time)} &middot; ${escapeHTML(p.room)}</p>
      </div>
    `).join('');
  });
</script>

</body>
</html>
