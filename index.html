<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Joint Conference 2026</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page-wrapper">
  <!-- Hero -->
  <div class="hero">
    <div class="hero-bg"></div>
    <div class="hero-content">
      <div class="logo-circle">
        <img src="images/jc2026.png" alt="Joint Conference 2026">
      </div>
      <h1>Joint Conference 2026</h1>
      <p class="venue">Merumatta Senggigi Resort, Lombok, Indonesia<br>October 21–23, 2026</p>
    </div>
  </div>

  <!-- Search (hidden by default, shown when "Find My Paper" clicked) -->
  <div class="search-section" id="searchSection">
    <div class="search-card">
      <div class="search-input-wrap">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zM9.5 14A4.5 4.5 0 1114 9.5 4.49 4.49 0 019.5 14z"/></svg>
        <input type="text" id="searchInput" placeholder="Search by paper ID, title, or author">
        <button class="search-close" id="searchClose" aria-label="Close search">&times;</button>
      </div>
      <div class="search-results" id="searchResults"></div>
    </div>
  </div>

  <!-- Menu Buttons -->
  <div class="menu-section">
    <button class="menu-btn" id="btnFindPaper">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zM9.5 14A4.5 4.5 0 1114 9.5 4.49 4.49 0 019.5 14z"/></svg>
      Find My Paper Detail
    </button>
    <a class="menu-btn" href="https://maps.app.goo.gl/1MKHtQLYADaKnbty7">
      <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1114.5 9 2.5 2.5 0 0112 11.5z"/></svg>
      Get Directions
    </a>
    <a class="menu-btn" href="#boa">
      <svg viewBox="0 0 24 24"><path d="M18 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V4a2 2 0 00-2-2zm0 18H6V4h2v8l2.5-1.5L13 12V4h5v16z"/></svg>
      Book of Abstract
    </a>
    <a class="menu-btn" href="#hotel-map">
      <svg viewBox="0 0 24 24"><path d="M20.5 3l-.16.03L15 5.1 9 3 3.36 4.9c-.21.07-.36.25-.36.48V20.5c0 .28.22.5.5.5l.16-.03L9 18.9l6 2.1 5.64-1.9c.21-.07.36-.25.36-.48V3.5c0-.28-.22-.5-.5-.5zM15 19l-6-2.11V5l6 2.11V19z"/></svg>
      Venue Floor Map
    </a>
    <a class="menu-btn" href="https://docs.google.com/spreadsheets/d/1awh0lbKdnLInmIKPCMM1alm1MJxI--gNO04dZ_6L5VE/edit?usp=sharing">
      <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V5a2 2 0 00-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/></svg>
      Full Schedule
    </a>
    <a class="menu-btn" href="https://docs.google.com/spreadsheets/d/1awh0lbKdnLInmIKPCMM1alm1MJxI--gNO04dZ_6L5VE/edit?usp=sharing">
      <svg viewBox="0 0 24 24"><path d="M21 19V5a2 2 0 00-2-2H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
      Documentation
    </a>
    <a class="menu-btn" href="#boa">
      <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>
      Certificate
    </a>
    <!-- <button class="menu-btn" id="btnOther">
      <svg viewBox="0 0 24 24"><path d="M6 10a2 2 0 100 4 2 2 0 000-4zm12 0a2 2 0 100 4 2 2 0 000-4zm-6 0a2 2 0 100 4 2 2 0 000-4z"/></svg>
      Other Menu
    </button> -->
  </div>

  <!-- Organizers -->
  <div class="organizers-section">
    <p class="section-label">Organizers</p>
    <div class="logo-row">
      <div class="org-logo">
        <img src="images/ugm.png" alt="Universitas Gadjah Mada">
      </div>
      <div class="org-logo">
        <img src="images/kmitl.png" alt="King Mongkut's Institute of Technology Ladkrabang">
      </div>
      <div class="org-logo">
        <img src="images/ieee.png" alt="IEEE Indonesia Section">
      </div>
    </div>
  </div>

  <!-- In cooperation with -->
  <div class="cooperation-section">
    <p class="section-label">in cooperation with</p>
    <div class="logo-row">
      <div class="org-logo">
        <img src="images/unram.png" alt="Universitas Mataram">
      </div>
      <div class="org-logo">
        <img src="images/UBG.png" alt="Universitas Bumigora">
      </div>
    </div>
  </div>

  <div class="footer">
    &copy; Joint Conference 2026. All rights reserved.
  </div>
</div>

<script>
  const btnFind = document.getElementById('btnFindPaper');
  const searchSection = document.getElementById('searchSection');
  const searchClose = document.getElementById('searchClose');
  const searchInput = document.getElementById('searchInput');
  const searchResults = document.getElementById('searchResults');

  let papers = [];

  // Load CSV
  fetch('https://script.google.com/macros/s/AKfycbx34mQTweCGekqFwArGFxdOH9J_yzpwtyBsi-MmaipQuwXHGEwI8bh5esSQ70eVCJ-ysw/exec')
  .then(r => r.json())
  .then(data => {
    papers = data.map(row => ({
      paperID: String(row['Paper ID'] || ''),
      conference: row['Conference'] || '',
      day: row['Day'] || '',
      room: row['Room'] || '',
      clusterCode: row['Cluster Code'] || '',
      sessionTopic: row['Session Topic'] || '',
      time: row['Time'] || '',
      slotNo: String(row['Slot No'] || ''),
      title: row['Title'] || '',
      presenter: row['Presenter(s)'] || '',
      authors: row['Authors'] || ''
    }));
  });

  function escapeHTML(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  btnFind.addEventListener('click', () => {
    searchSection.classList.add('active');
    btnFind.hidden = true;
    searchInput.focus();
  });

  searchClose.addEventListener('click', () => {
    searchSection.classList.remove('active');
    btnFind.hidden = false;
    searchInput.value = '';
    searchResults.innerHTML = '';
  });

  searchInput.addEventListener('input', () => {
    const q = searchInput.value.toLowerCase().trim();
    if (!q) { searchResults.innerHTML = ''; return; }

    const matched = papers.filter(p =>
      p.paperID.toLowerCase().includes(q) ||
      p.title.toLowerCase().includes(q) ||
      p.presenter.toLowerCase().includes(q) ||
      p.authors.toLowerCase().includes(q)
    );

    if (matched.length === 0) {
      searchResults.innerHTML = '<div class="no-results">No papers found.</div>';
      return;
    }

    searchResults.innerHTML = matched.map(p => `
      <div class="paper-card">
        <p class="paper-id">${escapeHTML(p.conference)} &middot; ${escapeHTML(p.paperID)}</p>
        <p class="paper-title">${escapeHTML(p.title)}</p>
        <p class="paper-meta"><strong>Presenter:</strong> ${escapeHTML(p.presenter)}</p>
        <p class="paper-meta"><strong>Authors:</strong> ${escapeHTML(p.authors)}</p>
        <p class="paper-meta"><strong>Session:</strong> ${escapeHTML(p.sessionTopic)}</p>
        <p class="paper-meta"><strong>Schedule:</strong> ${escapeHTML(p.day)}, ${escapeHTML(p.time)} &middot; ${escapeHTML(p.room)}</p>
      </div>
    `).join('');
  });
</script>

</body>
</html>
